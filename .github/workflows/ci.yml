# CI 门禁:构建 + 静态检查 + 全量测试(需要 PostgreSQL,测试基建见 db/testmain_test.go)
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gondar
          POSTGRES_PASSWORD: gondartest
          POSTGRES_DB: gondar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gondar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GONDAR_PG_DSN: postgres://gondar:gondartest@localhost:5432/gondar_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        # -p 1: 连 PG 的测试包不止持有跨包 advisory lock 的 db/agent/server 三个
        # (llmrec/evidence/traffic 等无锁),CI 多核并行时与 agent 包写事务死锁
        # (SQLSTATE 40P01,两轮稳定复现)。串行跑包与 TestMain 的锁设计意图一致。
        env:
          GONDAR_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
        # Each package receives a fresh DB so notification outboxes, fake model
        # settings and tool bindings cannot leak into the next package.
        run: bash ./scripts/test-postgres.sh
      - name: Local proxy certificate identity regression
        # 根 ./... 不进入带独立 go.mod 的 third_party；仅运行本地纯身份回归。
        run: go test github.com/lqqyt2423/go-mitmproxy/proxy -run '^TestGondarCertificateNameUsesConnectionLocalConnectFallback$' -count=1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
        working-directory: web
      - name: Verify vendored styles
        run: node ../scripts/check-vendored-styles.mjs
        working-directory: web
      # lint 暂不进门禁：存量 75 个 error 均为行为级修复（空 catch 补处理、悬浮
      # Promise 补 await、a11y），与最小 diff 原则冲突，留作独立治理任务；
      # build:static 已覆盖 TS 类型检查与静态导出验证。
      - name: Build (static export)
        run: npm run build:static
        working-directory: web
